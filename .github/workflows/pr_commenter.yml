name: Smart PR Reporter
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  list-files:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update PR File List
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Get the changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const fileNames = files.map(file => ` - ${file.filename}`).join('\n');
            
            // This hidden tag is our "fingerprint" to find the right comment later
            const header = "### 📂 Files changed in this PR:\n";
            const fingerprint = "";
            const body = `${header}${fileNames}\n\n${fingerprint}`;

            // 2. Find all comments on this PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            // 3. Find the comment that contains our fingerprint
            const botComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes(fingerprint)
            );

            if (botComment) {
              // 4. Update the existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // 5. Create a new comment if none was found
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
